<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="拾韵 —— 每日一词，云端诗词库极速检索">
  <title>拾韵 · 每日一词 | 古诗词极速检索</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%239e2b25'/><text x='50' y='70' font-size='54' text-anchor='middle' fill='%23fff' font-family='serif'>词</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
</head>
<body>

  <nav class="nav">
    <a class="brand" href="#top">
      <span class="brand-mark">拾韵</span>
      <span class="brand-sub">古诗词</span>
    </a>
    <div class="nav-links">
      <a href="#daily">每日一词</a>
      <a href="#library">诗词库</a>
      <a href="#about">关于</a>
    </div>
  </nav>

  <header id="top" class="hero">
    <div class="hero-inner reveal">
      <h1 class="hero-title">拾韵</h1>
      <p class="hero-tagline">每日一词 · 云端诗库 · 极速检索</p>
      <div class="hero-actions">
        <a class="btn btn-primary" href="#daily">今日一词</a>
        <a class="btn btn-ghost" href="#library">检索诗库</a>
      </div>
    </div>
    <svg class="mountains" viewBox="0 0 1440 220" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0,200 C120,120 240,80 380,140 C460,175 520,150 600,110 C700,60 780,90 880,140 C960,180 1040,160 1120,130 C1220,95 1320,140 1440,190 L1440,220 L0,220 Z" fill="rgba(60,50,40,0.10)"/>
      <path d="M0,210 C160,160 300,120 460,170 C560,200 660,170 780,150 C900,130 1000,170 1120,185 C1240,198 1340,175 1440,205 L1440,220 L0,220 Z" fill="rgba(60,50,40,0.18)"/>
    </svg>
  </header>

  <section id="daily" class="daily section">
    <div class="container">
      <div class="daily-head reveal">
        <span class="date-badge" id="daily-date"></span>
        <h2 class="daily-label"><span class="label-cn">每日一词</span><span class="label-en">POEM OF THE DAY</span></h2>
      </div>

      <div class="daily-card reveal">
        <div class="daily-poem">
          <h3 class="poem-title" id="daily-title">正在加载…</h3>
          <p class="poem-author" id="daily-author"></p>
          <p class="poem-lines" id="daily-lines"></p>
          <div class="daily-btns">
            <button class="btn btn-primary btn-sm" id="btn-daily-detail">阅读全文</button>
            <button class="btn btn-ghost btn-sm" id="btn-random">换一首 ⟳</button>
          </div>
        </div>
        <span class="seal" aria-hidden="true">拾韵之印</span>
      </div>
    </div>
  </section>

  <section id="library" class="library section section-alt">
    <div class="container">
      <div class="section-head reveal">
        <h2><span class="label-cn">诗词库</span><span class="label-en">LIBRARY</span></h2>
        <p class="count" id="library-count">正在连接云端数据库…</p>
      </div>

      <div class="toolbar reveal">
        <div class="search-box">
          <input type="search" id="search-input" placeholder="搜索作者、词牌或名句，如：李清照 / 明月几时有" autocomplete="off">
        </div>
        <div class="chips" id="dynasty-chips"></div>
      </div>

      <div class="progress" id="progress" hidden><i></i></div>
      <p class="load-status" id="load-status"></p>

      <div class="grid" id="poem-grid"></div>
      <div class="pagination" id="pagination"></div>
      <p class="empty" id="empty-tip" hidden></p>
    </div>
  </section>

  <footer id="about" class="footer">
    <div class="container">
      <p class="footer-brand">拾韵 · 每日一词</p>
      <p class="footer-text">每天与一首古典诗词相遇，在平仄与意象之间，感受汉语之美。</p>
      <p class="footer-meta">数据来源：中华古诗词开源数据库 · 纯静态网页</p>
    </div>
  </footer>

  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <article class="modal-card" role="dialog" aria-modal="true">
      <button class="modal-close" id="modal-close" aria-label="关闭">×</button>
      <header class="modal-header">
        <h3 class="poem-title" id="modal-title"></h3>
        <p class="poem-author" id="modal-author"></p>
      </header>
      <p class="poem-lines modal-lines" id="modal-lines"></p>
      <div class="ornament" aria-hidden="true">❦</div>
      <div class="tag-row" id="modal-tags"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost btn-sm" id="btn-copy">复制全篇</button>
      </div>
    </article>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="js/app.js"></script>
</body>
</html>
